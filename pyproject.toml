[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authguard-anomaly-detector"
version = "0.1.0"
description = "Unsupervised anomaly detection for aggregated authentication activity"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
authguard = "authguard.detector:main"

[tool.setuptools.packages.find]
where = ["src"]
